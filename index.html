<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Snake Game</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Arial', sans-serif;
      padding: 20px;
    }

    .container {
      text-align: center;
    }

    h1 {
      color: #fff;
      margin-bottom: 20px;
      font-size: 2.5em;
      text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
    }

    .game-wrapper {
      display: flex;
      gap: 30px;
      align-items: flex-start;
      justify-content: center;
      flex-wrap: wrap;
    }

    canvas {
      background: #1a1a2e;
      border: 3px solid #00ff88;
      border-radius: 10px;
      box-shadow: 0 0 20px rgba(0, 255, 136, 0.4);
      display: block;
      cursor: none;
    }

    .info-panel {
      background: rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(10px);
      border: 2px solid #00ff88;
      border-radius: 10px;
      padding: 20px;
      color: #fff;
      min-width: 200px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.2);
    }

    .score-display {
      font-size: 1.5em;
      margin-bottom: 15px;
    }

    .score-label {
      color: #00ff88;
      font-weight: bold;
    }

    .score-value {
      font-size: 2em;
      color: #00ff88;
      margin-top: 5px;
    }

    .controls {
      margin-top: 20px;
      font-size: 0.9em;
      line-height: 1.6;
      opacity: 0.9;
    }

    .controls h3 {
      color: #00ff88;
      margin-bottom: 10px;
    }

    .button-group {
      margin-top: 20px;
      display: flex;
      gap: 10px;
      flex-direction: column;
    }

    button {
      padding: 12px 24px;
      font-size: 1em;
      border: 2px solid #00ff88;
      background: #00ff88;
      color: #1e3c72;
      border-radius: 5px;
      cursor: pointer;
      font-weight: bold;
      transition: all 0.3s ease;
    }

    button:hover {
      background: #00dd77;
      box-shadow: 0 0 15px rgba(0, 255, 136, 0.5);
    }

    button:active {
      transform: scale(0.98);
    }

    .game-over {
      color: #ff4444;
      font-size: 1.2em;
      margin-top: 10px;
    }

    @media (max-width: 768px) {
      h1 {
        font-size: 1.8em;
      }

      .game-wrapper {
        flex-direction: column;
        gap: 20px;
      }

      canvas {
        border-width: 2px;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>🐍 Snake Game</h1>
    <div class="game-wrapper">
      <canvas id="gameCanvas" width="400" height="400"></canvas>
      <div class="info-panel">
        <div class="score-display">
          <div class="score-label">Score</div>
          <div class="score-value" id="score">0</div>
        </div>
        <div class="score-display">
          <div class="score-label">Best</div>
          <div class="score-value" id="best">0</div>
        </div>
        <div class="controls">
          <h3>How to Play</h3>
          <p>
            <strong>Arrow Keys</strong> or <strong>WASD</strong><br>
            to move the snake
          </p>
          <p style="margin-top: 10px;">
            Eat the <span style="color: #ff6b6b;">●</span> to grow<br>
            Don't hit walls or yourself!
          </p>
        </div>
        <div class="button-group">
          <button id="startBtn">Start Game</button>
          <button id="resetBtn">Reset</button>
        </div>
        <div class="game-over" id="gameOverMsg"></div>
      </div>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const scoreDisplay = document.getElementById('score');
    const bestDisplay = document.getElementById('best');
    const gameOverMsg = document.getElementById('gameOverMsg');
    const startBtn = document.getElementById('startBtn');
    const resetBtn = document.getElementById('resetBtn');

    const gridSize = 20;
    const tileCount = canvas.width / gridSize;

    let snake = [{x: 10, y: 10}];
    let food = {x: 15, y: 15};
    let direction = {x: 1, y: 0};
    let nextDirection = {x: 1, y: 0};
    let score = 0;
    let bestScore = localStorage.getItem('snakeBest') || 0;
    let gameRunning = false;
    let gameOver = false;

    bestDisplay.textContent = bestScore;

    function generateFood() {
      food = {
        x: Math.floor(Math.random() * tileCount),
        y: Math.floor(Math.random() * tileCount)
      };
      // Ensure food doesn't spawn on snake
      while (snake.some(segment => segment.x === food.x && segment.y === food.y)) {
        food = {
          x: Math.floor(Math.random() * tileCount),
          y: Math.floor(Math.random() * tileCount)
        };
      }
    }

    function draw() {
      // Clear canvas
      ctx.fillStyle = '#1a1a2e';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // Draw grid (subtle)
      ctx.strokeStyle = '#2a2a4e';
      ctx.lineWidth = 0.5;
      for (let i = 0; i <= tileCount; i++) {
        ctx.beginPath();
        ctx.moveTo(i * gridSize, 0);
        ctx.lineTo(i * gridSize, canvas.height);
        ctx.stroke();
        ctx.beginPath();
        ctx.moveTo(0, i * gridSize);
        ctx.lineTo(canvas.width, i * gridSize);
        ctx.stroke();
      }

      // Draw snake
      snake.forEach((segment, index) => {
        if (index === 0) {
          // Head
          ctx.fillStyle = '#00ff88';
          ctx.shadowColor = 'rgba(0, 255, 136, 0.6)';
          ctx.shadowBlur = 10;
        } else {
          // Body
          ctx.fillStyle = '#00cc66';
          ctx.shadowColor = 'transparent';
        }
        ctx.fillRect(
          segment.x * gridSize + 1,
          segment.y * gridSize + 1,
          gridSize - 2,
          gridSize - 2
        );
      });
      ctx.shadowColor = 'transparent';

      // Draw food
      ctx.fillStyle = '#ff6b6b';
      ctx.shadowColor = 'rgba(255, 107, 107, 0.6)';
      ctx.shadowBlur = 10;
      ctx.beginPath();
      ctx.arc(
        food.x * gridSize + gridSize / 2,
        food.y * gridSize + gridSize / 2,
        gridSize / 2 - 2,
        0,
        Math.PI * 2
      );
      ctx.fill();
      ctx.shadowColor = 'transparent';
    }

    function update() {
      if (!gameRunning || gameOver) return;

      direction = nextDirection;

      const head = snake[0];
      const newHead = {
        x: (head.x + direction.x + tileCount) % tileCount,
        y: (head.y + direction.y + tileCount) % tileCount
      };

      // Check collision with self
      if (snake.some(segment => segment.x === newHead.x && segment.y === newHead.y)) {
        endGame();
        return;
      }

      snake.unshift(newHead);

      // Check food collision
      if (newHead.x === food.x && newHead.y === food.y) {
        score += 10;
        scoreDisplay.textContent = score;
        generateFood();
      } else {
        snake.pop();
      }
    }

    function gameLoop() {
      update();
      draw();
      requestAnimationFrame(gameLoop);
    }

    function startGame() {
      if (!gameRunning) {
        gameRunning = true;
        gameOver = false;
        gameOverMsg.textContent = '';
        startBtn.textContent = 'Pause';
      } else {
        gameRunning = false;
        startBtn.textContent = 'Resume';
      }
    }

    function resetGame() {
      snake = [{x: 10, y: 10}];
      food = {x: 15, y: 15};
      direction = {x: 1, y: 0};
      nextDirection = {x: 1, y: 0};
      score = 0;
      gameRunning = false;
      gameOver = false;
      scoreDisplay.textContent = '0';
      gameOverMsg.textContent = '';
      startBtn.textContent = 'Start Game';
      draw();
    }

    function endGame() {
      gameOver = true;
      gameRunning = false;
      startBtn.textContent = 'Start Game';
      gameOverMsg.textContent = 'Game Over!';
      if (score > bestScore) {
        bestScore = score;
        bestDisplay.textContent = bestScore;
        localStorage.setItem('snakeBest', bestScore);
      }
    }

    // Keyboard controls
    document.addEventListener('keydown', (e) => {
      const key = e.key.toLowerCase();
      const keyCode = e.code;

      // Arrow keys and WASD
      if (keyCode === 'ArrowUp' || key === 'w') {
        if (direction.y === 0) nextDirection = {x: 0, y: -1};
        e.preventDefault();
      } else if (keyCode === 'ArrowDown' || key === 's') {
        if (direction.y === 0) nextDirection = {x: 0, y: 1};
        e.preventDefault();
      } else if (keyCode === 'ArrowLeft' || key === 'a') {
        if (direction.x === 0) nextDirection = {x: -1, y: 0};
        e.preventDefault();
      } else if (keyCode === 'ArrowRight' || key === 'd') {
        if (direction.x === 0) nextDirection = {x: 1, y: 0};
        e.preventDefault();
      }
    });

    // Button listeners
    startBtn.addEventListener('click', startGame);
    resetBtn.addEventListener('click', resetGame);

    // Initial draw
    draw();

    // Game loop at ~10 FPS for classic snake feel
    setInterval(gameLoop, 100);
  </script>
</body>
</html>
