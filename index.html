<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Snake Game</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      padding: 12px;
      margin: 0;
    }

    .container {
      text-align: center;
      width: 100%;
      max-width: 900px;
    }

    h1 {
      color: #fff;
      margin-bottom: 20px;
      font-size: clamp(1.5em, 8vw, 2.5em);
      text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
    }

    .game-wrapper {
      display: flex;
      gap: clamp(15px, 4vw, 30px);
      align-items: stretch;
      justify-content: center;
      flex-wrap: wrap;
    }

    canvas {
      background: #1a1a2e;
      border: 3px solid #00ff88;
      border-radius: 10px;
      box-shadow: 0 0 20px rgba(0, 255, 136, 0.4);
      display: block;
      cursor: none;
      width: 100%;
      max-width: 400px;
      height: auto;
      aspect-ratio: 1;
    }

    .info-panel {
      background: rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(10px);
      border: 2px solid #00ff88;
      border-radius: 10px;
      padding: clamp(16px, 4vw, 24px);
      color: #fff;
      flex: 1;
      min-width: 250px;
      max-width: 400px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.2);
      display: flex;
      flex-direction: column;
      justify-content: flex-start;
    }

    .score-display {
      font-size: clamp(1.2em, 5vw, 1.5em);
      margin-bottom: 15px;
    }

    .score-label {
      color: #00ff88;
      font-weight: bold;
    }

    .score-value {
      font-size: clamp(1.5em, 6vw, 2em);
      color: #00ff88;
      margin-top: 5px;
    }

    .controls {
      margin-top: 20px;
      font-size: clamp(0.8em, 3vw, 0.9em);
      line-height: 1.6;
      opacity: 0.9;
      text-align: left;
    }

    .controls h3 {
      color: #00ff88;
      margin-bottom: 10px;
      text-align: center;
    }

    .controls p {
      margin: 8px 0;
    }

    .button-group {
      margin-top: 20px;
      display: flex;
      gap: 10px;
      flex-direction: column;
    }

    button {
      padding: clamp(10px, 3vw, 14px) clamp(16px, 4vw, 24px);
      font-size: clamp(0.85em, 3vw, 1em);
      border: 2px solid #00ff88;
      background: #00ff88;
      color: #1e3c72;
      border-radius: 5px;
      cursor: pointer;
      font-weight: bold;
      transition: all 0.3s ease;
      touch-action: manipulation;
      min-height: 44px;
    }

    button:hover {
      background: #00dd77;
      box-shadow: 0 0 15px rgba(0, 255, 136, 0.5);
    }

    button:active {
      transform: scale(0.98);
    }

    button:focus {
      outline: 2px solid #fff;
      outline-offset: 2px;
    }

    .game-over {
      color: #ff4444;
      font-size: clamp(1em, 4vw, 1.2em);
      margin-top: 10px;
    }

    .touch-controls {
      display: none;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      margin-top: 20px;
      width: 100%;
    }

    .touch-controls.active {
      display: grid;
    }

    .arrow-btn {
      aspect-ratio: 1;
      padding: 0;
      font-size: 1.5em;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .arrow-btn.center {
      grid-column: 2;
      background: rgba(0, 255, 136, 0.2);
      border-color: #00ff88;
      cursor: default;
      pointer-events: none;
    }

    @media (max-width: 480px) {
      body {
        padding: 8px;
      }

      .game-wrapper {
        flex-direction: column;
        align-items: center;
      }

      .info-panel {
        width: 100%;
        max-width: none;
      }

      canvas {
        max-width: 100%;
      }

      .controls {
        text-align: center;
      }

      .touch-controls {
        display: grid;
      }

      .button-group {
        flex-direction: row;
      }

      button {
        flex: 1;
      }
    }

    @media (min-width: 481px) and (max-width: 768px) {
      .game-wrapper {
        flex-direction: column;
        align-items: center;
      }

      canvas {
        max-width: 100%;
        width: 100%;
      }

      .info-panel {
        width: 100%;
        max-width: none;
      }
    }

    @supports (padding: max(0px)) {
      body {
        padding: max(8px, env(safe-area-inset-bottom));
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>🐍 Snake Game</h1>
    <div class="game-wrapper">
      <canvas id="gameCanvas" width="400" height="400"></canvas>
      <div class="info-panel">
        <div class="score-display">
          <div class="score-label">Score</div>
          <div class="score-value" id="score">0</div>
        </div>
        <div class="score-display">
          <div class="score-label">Best</div>
          <div class="score-value" id="best">0</div>
        </div>
        <div class="controls">
          <h3>How to Play</h3>
          <p>
            <strong>Arrow Keys</strong> or <strong>WASD</strong><br>
            to move the snake
          </p>
          <p style="margin-top: 10px;">
            Eat the <span style="color: #ff6b6b;">●</span> to grow<br>
            Don't hit walls or yourself!
          </p>
        </div>
        <div class="touch-controls" id="touchControls">
          <button class="arrow-btn" data-direction="up">▲</button>
          <div class="arrow-btn center"></div>
          <div></div>
          <button class="arrow-btn" data-direction="left">◄</button>
          <div class="arrow-btn center"></div>
          <button class="arrow-btn" data-direction="right">►</button>
          <div></div>
          <button class="arrow-btn" data-direction="down">▼</button>
          <div></div>
        </div>
        <div class="button-group">
          <button id="startBtn">Start Game</button>
          <button id="resetBtn">Reset</button>
        </div>
        <div class="game-over" id="gameOverMsg"></div>
      </div>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const scoreDisplay = document.getElementById('score');
    const bestDisplay = document.getElementById('best');
    const gameOverMsg = document.getElementById('gameOverMsg');
    const startBtn = document.getElementById('startBtn');
    const resetBtn = document.getElementById('resetBtn');

    const gridSize = 20;
    const tileCount = canvas.width / gridSize;

    let snake = [{x: 10, y: 10}];
    let food = {x: 15, y: 15};
    let direction = {x: 1, y: 0};
    let nextDirection = {x: 1, y: 0};
    let score = 0;
    let bestScore = localStorage.getItem('snakeBest') || 0;
    let gameRunning = false;
    let gameOver = false;

    bestDisplay.textContent = bestScore;

    function generateFood() {
      food = {
        x: Math.floor(Math.random() * tileCount),
        y: Math.floor(Math.random() * tileCount)
      };
      // Ensure food doesn't spawn on snake
      while (snake.some(segment => segment.x === food.x && segment.y === food.y)) {
        food = {
          x: Math.floor(Math.random() * tileCount),
          y: Math.floor(Math.random() * tileCount)
        };
      }
    }

    function draw() {
      // Clear canvas
      ctx.fillStyle = '#1a1a2e';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // Draw grid (subtle)
      ctx.strokeStyle = '#2a2a4e';
      ctx.lineWidth = 0.5;
      for (let i = 0; i <= tileCount; i++) {
        ctx.beginPath();
        ctx.moveTo(i * gridSize, 0);
        ctx.lineTo(i * gridSize, canvas.height);
        ctx.stroke();
        ctx.beginPath();
        ctx.moveTo(0, i * gridSize);
        ctx.lineTo(canvas.width, i * gridSize);
        ctx.stroke();
      }

      // Draw snake
      snake.forEach((segment, index) => {
        if (index === 0) {
          // Head
          ctx.fillStyle = '#00a8ff';
          ctx.shadowColor = 'rgba(0, 168, 255, 0.6)';
          ctx.shadowBlur = 10;
        } else {
          // Body
          ctx.fillStyle = '#0080cc';
          ctx.shadowColor = 'transparent';
        }
        ctx.fillRect(
          segment.x * gridSize + 1,
          segment.y * gridSize + 1,
          gridSize - 2,
          gridSize - 2
        );
      });
      ctx.shadowColor = 'transparent';

      // Draw food
      ctx.fillStyle = '#ff6b6b';
      ctx.shadowColor = 'rgba(255, 107, 107, 0.6)';
      ctx.shadowBlur = 10;
      ctx.beginPath();
      ctx.arc(
        food.x * gridSize + gridSize / 2,
        food.y * gridSize + gridSize / 2,
        gridSize / 2 - 2,
        0,
        Math.PI * 2
      );
      ctx.fill();
      ctx.shadowColor = 'transparent';
    }

    function update() {
      if (!gameRunning || gameOver) return;

      direction = nextDirection;

      const head = snake[0];
      const newHead = {
        x: (head.x + direction.x + tileCount) % tileCount,
        y: (head.y + direction.y + tileCount) % tileCount
      };

      // Check collision with self
      if (snake.some(segment => segment.x === newHead.x && segment.y === newHead.y)) {
        endGame();
        return;
      }

      snake.unshift(newHead);

      // Check food collision
      if (newHead.x === food.x && newHead.y === food.y) {
        score += 10;
        scoreDisplay.textContent = score;
        generateFood();
      } else {
        snake.pop();
      }
    }

    function gameLoop() {
      update();
      draw();
      requestAnimationFrame(gameLoop);
    }

    function startGame() {
      if (!gameRunning) {
        gameRunning = true;
        gameOver = false;
        gameOverMsg.textContent = '';
        startBtn.textContent = 'Pause';
      } else {
        gameRunning = false;
        startBtn.textContent = 'Resume';
      }
    }

    function resetGame() {
      snake = [{x: 10, y: 10}];
      food = {x: 15, y: 15};
      direction = {x: 1, y: 0};
      nextDirection = {x: 1, y: 0};
      score = 0;
      gameRunning = false;
      gameOver = false;
      scoreDisplay.textContent = '0';
      gameOverMsg.textContent = '';
      startBtn.textContent = 'Start Game';
      draw();
    }

    function endGame() {
      gameOver = true;
      gameRunning = false;
      startBtn.textContent = 'Start Game';
      gameOverMsg.textContent = 'Game Over!';
      if (score > bestScore) {
        bestScore = score;
        bestDisplay.textContent = bestScore;
        localStorage.setItem('snakeBest', bestScore);
      }
    }

    // Keyboard controls
    document.addEventListener('keydown', (e) => {
      const key = e.key.toLowerCase();
      const keyCode = e.code;

      // Arrow keys and WASD
      if (keyCode === 'ArrowUp' || key === 'w') {
        if (direction.y === 0) nextDirection = {x: 0, y: -1};
        e.preventDefault();
      } else if (keyCode === 'ArrowDown' || key === 's') {
        if (direction.y === 0) nextDirection = {x: 0, y: 1};
        e.preventDefault();
      } else if (keyCode === 'ArrowLeft' || key === 'a') {
        if (direction.x === 0) nextDirection = {x: -1, y: 0};
        e.preventDefault();
      } else if (keyCode === 'ArrowRight' || key === 'd') {
        if (direction.x === 0) nextDirection = {x: 1, y: 0};
        e.preventDefault();
      }
    });

    // Button listeners
    startBtn.addEventListener('click', startGame);
    resetBtn.addEventListener('click', resetGame);

    // Touch controls for mobile
    document.querySelectorAll('.arrow-btn[data-direction]').forEach(btn => {
      btn.addEventListener('click', (e) => {
        const dir = e.target.dataset.direction;
        if (dir === 'up' && direction.y === 0) nextDirection = {x: 0, y: -1};
        else if (dir === 'down' && direction.y === 0) nextDirection = {x: 0, y: 1};
        else if (dir === 'left' && direction.x === 0) nextDirection = {x: -1, y: 0};
        else if (dir === 'right' && direction.x === 0) nextDirection = {x: 1, y: 0};
      });
    });

    // Responsive canvas sizing
    function resizeCanvas() {
      const container = canvas.parentElement;
      const maxSize = Math.min(container.clientWidth, window.innerHeight - 120);
      canvas.width = Math.max(200, Math.min(maxSize, 400));
      canvas.height = canvas.width;
      draw();
    }

    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    // Show/hide touch controls based on device
    function updateTouchControls() {
      const touchControls = document.getElementById('touchControls');
      const isMobile = window.innerWidth <= 480;
      if (isMobile) {
        touchControls.classList.add('active');
      } else {
        touchControls.classList.remove('active');
      }
    }
    window.addEventListener('resize', updateTouchControls);
    updateTouchControls();

    // Initial draw
    draw();

    // Game loop at ~10 FPS for classic snake feel
    setInterval(gameLoop, 100);
  </script>
</body>
</html>
